# Alembic configuration for TIDE.
#
# The database URL is intentionally NOT stored here. It is injected at runtime
# from the typed application settings (backend/core/config.py), which read the
# environment — so secrets never live in this file.
#
# Phase 0 ships zero migrations: this configures the tool so later phases can
# `alembic revision --autogenerate` against the real ORM models.

[alembic]
script_location = backend/migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is populated programmatically in backend/migrations/env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
