[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tide"
version = "0.0.0"
description = "TIDE — Concept Graph and Trend Intelligence System (Phase 0 scaffold)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "TIDE" }]

# NOTE: These are the runtime dependencies for the Phase 0 scaffold only.
# External-service SDKs (Postgres drivers, R2/S3 clients, LLM SDKs, etc.) are
# intentionally NOT added here yet — they arrive with their concrete adapters
# in later phases. Interfaces in `contracts/` have no third-party dependencies.
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "structlog>=24.1",
  # Phase 1 data foundation:
  "psycopg[binary]>=3.1",   # PostgreSQL driver (postgresql+psycopg://)
  "pgvector>=0.2.5",        # pgvector SQLAlchemy column type (dimension unspecified)
  "boto3>=1.34",            # S3-compatible client for the Cloudflare R2 adapter
  "PyYAML>=6.0",            # load the curated seed_list.yaml
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[tool.setuptools]
# TIDE is a monorepo of cooperating top-level packages rather than a single
# nested package. Each subsystem is independently importable and testable.
packages = [
  "contracts",
  "scrapers",
  "intelligence",
  "graph",
  "agent",
  "workers",
  "backend",
  "backend.core",
  "backend.api",
  "backend.api.routes",
  "backend.db",
  "backend.db.models",
  "backend.seeds",
  "storage",
]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q"
asyncio_mode = "auto"
markers = [
  "db: test requires a PostgreSQL database (auto-skipped if none is configured)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["contracts", "scrapers", "intelligence", "graph", "agent", "workers", "backend", "storage", "tests"]
extend-exclude = ["backend/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ANN"]
ignore = [
  "ANN101", # missing type annotation for `self`
  "ANN102", # missing type annotation for `cls`
  "ANN401", # allow `Any` for genuinely dynamic values (boto3 client, raw YAML)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["contracts", "scrapers", "intelligence", "graph", "agent", "workers", "backend", "storage"]
exclude = ["backend/migrations/"]

[tool.mypy-tests]
disallow_untyped_defs = false
