# ============================================================
# OFFICIAL / PRIMARY SOURCES
# ============================================================

  rss:
    feeds:
      - name: "OpenAI"
        url: "https://openai.com/news/rss.xml"

      - name: "Google AI"
        url: "https://blog.google/technology/ai/rss/"

      - name: "AWS Machine Learning Blog"
        url: "https://aws.amazon.com/blogs/machine-learning/feed/"

# ============================================================
# INITIAL COLLECTION POLICY
# ============================================================

policy:

  bootstrap:
    enabled: true
    lookback_days: 60
    run_once: true

  daily:
    enabled: true
    interval: daily

  language:
    allowed:
      - en

  discovery:
    allow_new_concepts: true
    allow_new_entities: true
    allow_new_relationships: true

  seed_behavior:
    seeds_are_beachhead_only: true
    do_not_treat_seeds_as_complete_vocabulary: true
    allow_graph_to_expand_beyond_seed_list: true