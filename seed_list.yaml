version: 1

domain:
  name: "Global Technical Ecosystem"
  language: "en"
  description: >
    AI, developer tools, software engineering, infrastructure,
    cloud, data, cybersecurity, and adjacent technical practices.

collection:
  historical_lookback_days: 60
  historical_mode: bootstrap_once
  daily_mode: incremental
  default_timezone: UTC

