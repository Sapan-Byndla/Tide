# Tide Configuration File

database:
  # Connection string to Supabase Postgres. Override via TIDE_DATABASE_URL environment variable.
  url: "postgresql://postgres:[PASSWORD]@aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require"
  pool_size_min: 5
  pool_size_max: 20

services:
  embedding:
    host: "127.0.0.1"
    port: 8001
    model_name: "nomic-ai/nomic-embed-text-v1.5"
    batch_size: 64
  ingest:
    host: "127.0.0.1"
    port: 8002
    embedding_similarity_threshold: 0.55
    ema_alpha: 0.05
  read_api:
    host: "127.0.0.1"
    port: 8003

phrase_extraction:
  # Minimum length of phrase token words
  min_token_length: 3
  # Characters to clean
  clean_pattern: '[^a-zA-Z0-9\s-]'

pending_pool:
  similarity_threshold: 0.55
  min_component_size: 3
  ttl_days: 14
  distinctive_token_frequency_threshold: 0.01 # Tokens appearing in < 1% of global corpus

phrase_graduation:
  min_count_last_7d: 5
  min_source_count: 2
  velocity_multiplier: 3.0 # count_last_7d > 3 * count_prior_7d
  graduate_count_last_7d: 10
  min_title_appearances: 3
  noise_days: 30

community_detection:
  recency_decay_lambda: 0.02 # lambda parameter in exp(-lambda * age_days)
  min_edge_co_count: 2

concept_maintenance:
  merge_similarity_threshold: 0.85
  merge_shared_posts_ratio: 0.30 # share at least 30% of their last 30 days of post ids
  split_min_posts: 50
  split_subcluster_min_posts: 10

scrapers:
  # Scraper api keys and crawl limits
  github:
    enabled: true
    token: ""
    limit: 100
  arxiv:
    enabled: true
    limit: 100
  hackernews:
    enabled: true
    limit: 100
  stackoverflow:
    enabled: true
    limit: 100
  newsapi:
    enabled: false
    api_key: ""
    limit: 50
